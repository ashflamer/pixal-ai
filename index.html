<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Search Console Ownership -->
    <meta name="google-site-verification" content="google-site-verification-token-here" />
    
    <!-- PIXAL AI SEO Meta Tags -->
    <meta name="description" content="PIXAL AI is a free AI chatbot made by Ashwin. Chat with PIXAL AI for smart conversations and instant answers!">
    <meta name="keywords" content="PIXAL AI, AI Chatbot, Chatbot Online, AI Chat, Groq API Chatbot, Ashwin Chatbot, PIXAL GPT, ChatGPT Alternative">
    <meta name="author" content="Ashwin">
    <meta name="robots" content="index, follow">

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="PIXAL AI - Official Chatbot">
    <meta property="og:description" content="PIXAL AI is a smart AI chatbot built by Ashwin. Start chatting now!">
    <meta property="og:url" content="https://ashflamer.github.io/pixal-ai/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://ashflamer.github.io/pixal-ai/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXAL AI - Powered by Llama 3 8B</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --accent-color: #58a6ff;
            --user-bubble: #1f6feb;
            --ai-bubble: #21262d;
            --text-color: #c9d1d9;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-card {
            width: 95%;
            max-width: 700px;
            height: 85vh;
            background: var(--container-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        #chat-display {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .user-msg {
            align-self: flex-end;
            background-color: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background-color: var(--ai-bubble);
            color: var(--text-color);
            border: 1px solid #30363d;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            padding: 20px;
            background: #161b22;
            display: flex;
            gap: 10px;
            border-top: 1px solid #30363d;
        }

        input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* Styling the scrollbar */
        #chat-display::-webkit-scrollbar { width: 6px; }
        #chat-display::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="chat-card">
        <div class="header">
            <h1>PIXAL AI</h1>
            <small style="color: #8b949e;">Powered by Ashwin & Llama 3</small>
        </div>

        <div id="chat-display">
            <div class="msg ai-msg">Hi! I'm PIXAL. How can I help you today?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask me anything..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // API Key and Configuration
        const API_KEY = "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";
        const MODEL = "llama3-8b-8192";

        async function sendMessage() {
            const inputElement = document.getElementById("userInput");
            const chatDisplay = document.getElementById("chat-display");
            const query = inputElement.value.trim();

            if (!query) return;

            // Add User Message to UI
            appendMessage(query, 'user-msg');
            inputElement.value = "";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [{ role: "user", content: query }],
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                // Add AI Message to UI
                appendMessage(aiText, 'ai-msg');

            } catch (error) {
                console.error("Error:", error);
                appendMessage("Oops! Something went wrong. Please check your connection.", 'ai-msg');
            }
        }

        function appendMessage(text, className) {
            const chatDisplay = document.getElementById("chat-display");
            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${className}`;
            msgDiv.innerText = text;
            chatDisplay.appendChild(msgDiv);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }
    </script>
</body>
</html>
