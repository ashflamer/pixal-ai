<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXAL AI - Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #58a6ff; --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .chat-container { width: 95%; max-width: 800px; height: 90vh; background: var(--card); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { padding: 15px 25px; background: #21262d; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .ai { background: #21262d; align-self: flex-start; border: 1px solid var(--border); }
        .user { background: #1f6feb; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .input-box { padding: 20px; background: #161b22; display: flex; gap: 10px; border-top: 1px solid var(--border); }
        input { flex: 1; background: #0d1117; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: white; outline: none; }
        button { background: var(--primary); color: #0d1117; border: none; padding: 0 25px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h1 style="font-size: 1.2rem; color: var(--primary); margin: 0;">PIXAL AI</h1>
            <span id="status" style="font-size: 0.7rem; color: #8b949e;">Connecting...</span>
        </div>
        <div id="chat-window">
            <div class="msg ai" id="init-msg">Waking up the brain...</div>
        </div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') askPIXAL()">
            <button id="sendBtn" onclick="askPIXAL()">Send</button>
        </div>
    </div>

    <script>
        let KEY = "";

        // Fetching the key from Askfalmer.txt
        async function fetchKey() {
            try {
                // cache-busting added to ensure it gets the fresh key
                const response = await fetch('Askfalmer.txt?v=' + new Date().getTime());
                if (!response.ok) throw new Error();
                const data = await response.text();
                KEY = data.trim();
                document.getElementById('status').innerText = "ONLINE";
                document.getElementById('init-msg').innerText = "PIXAL AI is active. How can I help today?";
            } catch (err) {
                document.getElementById('status').innerText = "OFFLINE";
                document.getElementById('init-msg').innerText = "Error: Create 'Askfalmer.txt' in your repo and paste the key there.";
            }
        }
        fetchKey();

        async function askPIXAL() {
            const input = document.getElementById("userInput");
            const window = document.getElementById("chat-window");
            const btn = document.getElementById("sendBtn");
            const text = input.value.trim();

            if (!text || !KEY) return;

            window.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            btn.disabled = true;
            window.scrollTop = window.scrollHeight;

            try {
                const proxy = "https://corsproxy.io/?";
                const target = "https://api.groq.com/openai/v1/chat/completions";
                
                const response = await fetch(proxy + encodeURIComponent(target), {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const aiReply = data.choices[0].message.content;
                window.innerHTML += `<div class="msg ai">${aiReply}</div>`;

            } catch (err) {
                window.innerHTML += `<div class="msg ai" style="color: #ff7b72;"><b>System:</b> ${err.message}</div>`;
            } finally {
                btn.disabled = false;
                window.scrollTop = window.scrollHeight;
            }
        }
    </script>
</body>
</html>
