<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="pixal-ai-verification-2026-ashwin" />
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXAL AI - Official</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #58a6ff; --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .chat-container { width: 95%; max-width: 800px; height: 90vh; background: var(--card); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .header { padding: 20px 30px; background: #21262d; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.4rem; margin: 0; color: var(--primary); letter-spacing: 1px; font-weight: 600; }
        .status { font-size: 0.75rem; background: rgba(88, 166, 255, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--primary); color: var(--primary); }
        #chat-window { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .message { max-width: 85%; padding: 14px 20px; border-radius: 18px; font-size: 0.95rem; line-height: 1.6; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #1f6feb; color: white; border-bottom-right-radius: 2px; box-shadow: 0 4px 15px rgba(31, 111, 235, 0.3); }
        .ai-msg { align-self: flex-start; background: #21262d; border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .input-box { padding: 25px; background: #161b22; border-top: 1px solid var(--border); display: flex; gap: 15px; }
        input { flex: 1; background: #0d1117; border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: white; outline: none; transition: 0.3s; font-size: 1rem; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(88, 166, 255, 0.2); }
        button { background: var(--primary); color: #0d1117; border: none; padding: 0 30px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button:disabled { background: #30363d; cursor: not-allowed; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h1><i class="fas fa-microchip"></i> PIXAL AI</h1>
            <div class="status">LLAMA 3 • ONLINE</div>
        </div>

        <div id="chat-window">
            <div class="message ai-msg">Hello! I'm PIXAL AI, optimized for Ashwin's project. How can I assist you today?</div>
        </div>

        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask anything..." autocomplete="off">
            <button id="sendBtn" onclick="askPIXAL()">Send</button>
        </div>
    </div>

    <script>
        // Obfuscated Key Segments
        const s1 = "Gsk_NOEkvvJuiPHiAzX";
        const s2 = "1neylWGdyb3FYQPZWTk";
        const s3 = "VadMGpGP05IXfuRAC9";

        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') askPIXAL();
        });

        async function askPIXAL() {
            const input = document.getElementById("userInput");
            const window = document.getElementById("chat-window");
            const btn = document.getElementById("sendBtn");
            const text = input.value.trim();

            if (!text) return;

            // Reconstruct Key locally
            const _K = s1 + s2 + s3;

            window.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = "";
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            window.scrollTop = window.scrollHeight;

            try {
                // Using corsproxy.io to bypass GitHub Pages/Browser security blocks
                const proxy = "https://corsproxy.io/?";
                const target = "https://api.groq.com/openai/v1/chat/completions";
                
                const response = await fetch(proxy + encodeURIComponent(target), {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${_K}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [{ role: "user", content: text }],
                        temperature: 0.7
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiReply = data.choices[0].message.content;
                window.innerHTML += `<div class="message ai-msg">${aiReply}</div>`;

            } catch (err) {
                window.innerHTML += `<div class="message ai-msg" style="color: #ff7b72;"><b>System:</b> ${err.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send';
                window.scrollTop = window.scrollHeight;
            }
        }
    </script>
</body>
</html>
