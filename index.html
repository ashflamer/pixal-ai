<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="pixal-ai-verification-2026-ashwin" />
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXAL AI - Llama 3 8B</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #58a6ff; --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .chat-container { width: 95%; max-width: 700px; height: 90vh; background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .header { padding: 15px 25px; background: #21262d; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.3rem; margin: 0; color: var(--primary); letter-spacing: 0.5px; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { max-width: 85%; padding: 12px 18px; border-radius: 14px; font-size: 0.95rem; line-height: 1.6; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #1f6feb; color: white; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: #21262d; border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .input-box { padding: 20px; background: #161b22; border-top: 1px solid var(--border); display: flex; gap: 12px; }
        input { flex: 1; background: #0d1117; border: 1px solid var(--border); padding: 14px; border-radius: 10px; color: white; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(88, 166, 255, 0.2); }
        button { background: var(--primary); color: #0d1117; border: none; padding: 0 25px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        button:disabled { background: #30363d; cursor: not-allowed; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h1><i class="fas fa-microchip"></i> PIXAL AI</h1>
            <span style="font-size: 0.7rem; opacity: 0.6; font-weight: 600; text-transform: uppercase;">Llama-3-8B-Turbo</span>
        </div>

        <div id="chat-window">
            <div class="message ai-msg">PIXAL AI is online with your new key. How can I help you, Ashwin?</div>
        </div>

        <div class="input-box">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn" onclick="askPIXAL()">Send</button>
        </div>
    </div>

    <script>
        // Updated API Key
        const KEY = "Gsk_KSkKKbxO8LOh4NMyeNunWGdyb3FYnWpcRy0e7ltUASVIo1IZCQJf";

        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') askPIXAL();
        });

        async function askPIXAL() {
            const input = document.getElementById("userInput");
            const window = document.getElementById("chat-window");
            const btn = document.getElementById("sendBtn");
            const text = input.value.trim();

            if (!text) return;

            // Add user message to UI
            window.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = "";
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            window.scrollTop = window.scrollHeight;

            try {
                // Using corsproxy.io to bypass browser security
                const proxyUrl = "https://corsproxy.io/?";
                const targetUrl = "https://api.groq.com/openai/v1/chat/completions";
                
                const response = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [{ role: "user", content: text }],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errBody = await response.json();
                    throw new Error(errBody.error?.message || "Connection Refused");
                }

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                window.innerHTML += `<div class="message ai-msg">${aiReply}</div>`;

            } catch (err) {
                console.error(err);
                window.innerHTML += `<div class="message ai-msg" style="color: #ff7b72;"><b>System Error:</b> ${err.message}. Please verify the key is active in your Groq dashboard.</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send';
                window.scrollTop = window.scrollHeight;
            }
        }
    </script>
</body>
</html>
